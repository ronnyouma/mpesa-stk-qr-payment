services:
  - type: web
    name: payhero-qr-payment
    env: node
    region: oregon
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_PROVIDER
        sync: false
      - key: PAYHERO_NETWORK_CODE
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: PAYHERO_BASE_URL
        sync: false
      - key: PAYHERO_API_URL
        sync: false
